<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- 3D Check Folds -->
    <linearGradient id="foldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A4365"/>
      <stop offset="100%" stop-color="#1A2D4C"/>
    </linearGradient>
    <linearGradient id="foldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="800" height="200" fill="none"/>

  <!-- Scaled Logo Icon Component (Left) -->
  <g transform="translate(10, 10) scale(0.35)">
    <!-- Folded Checkmark -->
    <path d="M 120,240 L 220,340 L 220,300 L 140,220 Z" fill="url(#foldLeft)" />
    <path d="M 220,340 L 400,160 L 360,120 L 220,260 Z" fill="url(#foldRight)" />
    <line x1="260" y1="230" x2="330" y2="160" stroke="#F8FAF4" stroke-width="6" opacity="0.3" stroke-linecap="round"/>
    <line x1="280" y1="270" x2="350" y2="200" stroke="#F8FAF4" stroke-width="6" opacity="0.3" stroke-linecap="round"/>

    <!-- Geotag Pin -->
    <g transform="translate(180, 220)" filter="url(#glow)">
      <path d="M 40,0 C 18,0 0,18 0,40 C 0,70 40,110 40,110 C 40,110 80,70 80,40 C 80,18 62,0 40,0 Z" fill="#F8FAF4"/>
      <circle cx="40" cy="40" r="22" fill="#0A1D37"/>
      <circle cx="40" cy="40" r="18" fill="none" stroke="#F8FAF4" stroke-width="2"/>
      <circle cx="40" cy="40" r="10" fill="#0D9488"/>
      <circle cx="36" cy="36" r="3" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

  <!-- Typography Wordmark Component (Right) -->
  <!-- "Claim" in clean, tracked off-white bold sans-serif -->
  <text x="215" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#F8FAF4" letter-spacing="2">CLAIM</text>
  
  <!-- "Mate" in Compliance Teal -->
  <text x="510" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="80" font-weight="300" fill="#0D9488" letter-spacing="2">MATE</text>
  
  <!-- Subtitle Tagline -->
  <text x="220" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="6">FIELD INSPECTION COMPANION</text>
</svg>
