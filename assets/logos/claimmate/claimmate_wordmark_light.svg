<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Solid corporate tones for crisp rendering on paper -->
    <linearGradient id="foldLeftLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2D4C"/>
      <stop offset="100%" stop-color="#0A1D37"/>
    </linearGradient>
    <linearGradient id="foldRightLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->
  <rect width="800" height="200" fill="none"/>

  <!-- Scaled Logo Icon Component (Left) -->
  <g transform="translate(10, 10) scale(0.35)">
    <!-- Folded Checkmark -->
    <path d="M 120,240 L 220,340 L 220,300 L 140,220 Z" fill="url(#foldLeftLight)" />
    <path d="M 220,340 L 400,160 L 360,120 L 220,260 Z" fill="url(#foldRightLight)" />
    
    <!-- Lines on document -->
    <line x1="260" y1="230" x2="330" y2="160" stroke="#FFFFFF" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
    <line x1="280" y1="270" x2="350" y2="200" stroke="#FFFFFF" stroke-width="6" opacity="0.4" stroke-linecap="round"/>

    <!-- Geotag Pin (Dark/Contrast) -->
    <g transform="translate(180, 220)">
      <path d="M 40,0 C 18,0 0,18 0,40 C 0,70 40,110 40,110 C 40,110 80,70 80,40 C 80,18 62,0 40,0 Z" fill="#0A1D37"/>
      <circle cx="40" cy="40" r="22" fill="#FFFFFF"/>
      <circle cx="40" cy="40" r="18" fill="none" stroke="#0A1D37" stroke-width="2"/>
      <circle cx="40" cy="40" r="10" fill="#0D9488"/>
      <circle cx="36" cy="36" r="3" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

  <!-- Typography Wordmark Component (Right) -->
  <!-- "Claim" in Corporate Navy -->
  <text x="215" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#0A1D37" letter-spacing="2">CLAIM</text>
  
  <!-- "Mate" in Compliance Teal -->
  <text x="510" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="80" font-weight="300" fill="#0D9488" letter-spacing="2">MATE</text>
  
  <!-- Subtitle Tagline (Muted Slate) -->
  <text x="220" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748B" letter-spacing="6">FIELD INSPECTION COMPANION</text>
</svg>
