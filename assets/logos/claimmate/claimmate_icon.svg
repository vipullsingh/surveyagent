<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Accent Gradient (Steel Blue to Compliance Teal) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A4365"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Stylized Shield & Checkmark Graphic -->
  <g transform="translate(0, 5)">
    <!-- Outer Shield Frame -->
    <path d="M 256,100 L 380,150 C 380,270 290,360 256,400 C 222,360 132,270 132,150 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linejoin="round" />

    <!-- Inner Precision Crosshairs -->
    <circle cx="256" cy="220" r="60" fill="none" stroke="#F8FAF4" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
    <line x1="256" y1="140" x2="256" y2="300" stroke="#F8FAF4" stroke-width="4" opacity="0.4"/>
    <line x1="176" y1="220" x2="336" y2="220" stroke="#F8FAF4" stroke-width="4" opacity="0.4"/>
    <circle cx="256" cy="220" r="10" fill="#0F766E"/>

    <!-- Validation Checkmark Overlay (Glowing) -->
    <path d="M 190,220 L 240,270 L 340,160" 
          fill="none" stroke="#F8FAF4" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" 
          filter="url(#glow)"/>
  </g>
</svg>
